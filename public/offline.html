<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#160f1f">
  <title>연결 확인 | Focus Quest</title>
  <style>
    :root { color-scheme: dark; font-family: "Malgun Gothic", system-ui, sans-serif; color: #f5f1e8; background: #160f1f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; align-items: center; padding: 32px 24px; }
    main { width: min(100%, 520px); margin-inline: auto; }
    img { width: 68px; height: 68px; margin-bottom: 32px; }
    h1 { margin: 0 0 20px; font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.3; letter-spacing: -.025em; text-wrap: balance; }
    p { margin: 0 0 24px; color: #d9cde0; font-size: 1rem; line-height: 1.8; overflow-wrap: anywhere; }
    output { display: block; margin-block: 24px; color: #f4c477; font-size: clamp(2.75rem, 12vw, 4rem); font-variant-numeric: tabular-nums; }
    button { min-height: 48px; padding: 12px 22px; border: 0; border-radius: 12px; background: #f4b858; color: #160f1f; font: inherit; font-weight: 750; cursor: pointer; }
    button:hover { background: #ffd187; }
    button:focus-visible { outline: 3px solid #72d4ca; outline-offset: 5px; }
    button:disabled { cursor: wait; opacity: .65; }
    ::selection { background: #f4b858; color: #160f1f; }
    [hidden] { display: none !important; }
    small { display: block; margin-top: 24px; color: #c4b4cc; font-size: .875rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <img src="./brand/focus-quest-mark.png" alt="Focus Quest">
    <h1>연결을 잠시 놓쳤어요.</h1>
    <p id="message" role="status">인터넷이 연결되면 모험으로 돌아갈 수 있어요. 이 화면에서는 기록을 변경하지 않아요.</p>
    <output id="timer" aria-label="기기에 남아 있는 타이머" hidden></output>
    <button id="retry" type="button">다시 연결하기</button>
    <small>진행 중이던 집중과 완료 기록은 연결 후 앱에서 확인해 주세요. 계정·공부 자료는 이 안내 화면에 저장되지 않아요.</small>
    <noscript><p>인터넷 연결을 확인한 뒤 브라우저를 새로고침해 주세요.</p></noscript>
  </main>
  <script>
    const timer = document.getElementById("timer");
    const message = document.getElementById("message");
    const retry = document.getElementById("retry");
    function renderTimer() {
      try {
        const session = JSON.parse(localStorage.getItem("haru-focus-active-session"));
        if (!session || session.version !== 1 || !["focus", "break"].includes(session.mode)) return;
        if (!Number.isFinite(session.remainingSeconds) || session.remainingSeconds < 0 || session.remainingSeconds > 7200) return;
        if (!session.paused && (!Number.isFinite(session.endAt) || session.endAt <= 0)) return;
        const seconds = session.paused ? session.remainingSeconds : Math.max(0, Math.ceil((session.endAt - Date.now()) / 1000));
        if (seconds > 7200) return;
        timer.hidden = false;
        timer.textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
        if (seconds === 0) message.textContent = "타이머 시간이 끝났어요. 연결 후 앱으로 돌아가 완료 기록을 확인해 주세요.";
      } catch { /* Local storage is optional. No data is written here. */ }
    }
    retry.addEventListener("click", () => { retry.disabled = true; location.reload(); });
    window.addEventListener("online", () => { message.textContent = "다시 연결됐어요. 버튼을 눌러 모험으로 돌아가세요."; });
    renderTimer();
    setInterval(renderTimer, 1000);
  </script>
</body>
</html>
