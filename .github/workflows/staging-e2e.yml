name: Isolated Supabase E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start isolated Supabase
        run: >-
          npx --yes supabase@3.3.0 start
          -x studio,imgproxy,mailpit,logflare,vector,supavisor,edge-runtime

      - name: Export ephemeral test credentials
        shell: bash
        run: node scripts/export-local-supabase-env.mjs >> "$GITHUB_ENV"

      - name: Run isolated account journeys
        run: npm run test:e2e:staging

      - name: Stop isolated Supabase
        if: always()
        run: npx --yes supabase@3.3.0 stop --no-backup

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
