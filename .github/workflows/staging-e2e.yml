name: Staging E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run isolated account journeys
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_PRODUCTION_SUPABASE_URL: ${{ secrets.E2E_PRODUCTION_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
        run: npm run test:e2e:staging

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
