name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test product rules
        run: npm run test:logic

      - name: Lint source
        run: npm run lint

      - name: Build Cloudflare worker
        run: npm run build

      - name: Verify rendered app
        run: node --test tests/rendered-html.test.mjs
