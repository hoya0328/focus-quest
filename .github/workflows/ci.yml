name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test product rules
        run: npm run test:logic

      - name: Check technical documentation
        run: |
          npm run docs:check
          npm run test:docs

      - name: Lint source
        run: npm run lint

      - name: Build Cloudflare worker
        run: npm run build

      - name: Scan source, build and history for secrets
        run: npm run security:secrets

      - name: Verify rendered app
        run: node --test tests/rendered-html.test.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test guest and responsive journeys
        run: npm run test:e2e -- --max-failures=3

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: guest-e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
