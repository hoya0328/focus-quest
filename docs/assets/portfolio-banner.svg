<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Focus Quest | A little focus. A new adventure.</title>
  <desc id="description">다시 시작하는 집중을 위한 픽셀 모험. 오른쪽은 실제 등산 모험에 사용하는 배경 아트입니다.</desc>
  <defs><clipPath id="art"><rect x="660" width="540" height="454"/></clipPath></defs>
  <rect width="1200" height="520" fill="#ECF9FA"/>
  <image href="../../public/backgrounds/hike-pixel-summit-v1.png" x="660" width="540" height="454" preserveAspectRatio="xMidYMid slice" clip-path="url(#art)"/>
  <g font-family="Segoe UI,Malgun Gothic,Arial,sans-serif" letter-spacing="0">
    <path d="M52 49H80" stroke="#126879" stroke-width="4"/>
    <text x="92" y="55" font-size="15" font-weight="600" fill="#126879">03 / FOCUS &amp; PIXEL ADVENTURE</text>
    <text x="48" y="160" font-size="73" font-weight="750" fill="#163E47">Focus Quest</text>
    <text x="52" y="217" font-size="29" font-weight="700" fill="#126879">다시 시작하는 순간도, 모험이니까.</text>
    <text x="52" y="271" font-size="20" fill="#4A666D">집중한 시간을 작은 모험으로 바꾸고</text>
    <text x="52" y="303" font-size="20" fill="#4A666D">중단 후 복귀까지 함께 설계한 포모도로</text>
    <path d="M52 343H610" stroke="#BCDCE0"/>
    <text x="52" y="382" font-size="20" font-weight="700" fill="#163E47">START / FOCUS / REST / RETURN</text>
    <text x="52" y="414" font-size="15" fill="#4A666D">A little focus. A new adventure.</text>
    <rect y="454" width="1200" height="66" fill="#AFE8EC"/>
    <text x="52" y="495" font-size="18" font-weight="600" fill="#163E47">HOYA / PRODUCT &amp; ENGINEERING</text>
    <text x="1148" y="495" text-anchor="end" font-size="18" fill="#163E47">WEB &amp; PWA · PROJECT ART</text>
  </g>
</svg>
